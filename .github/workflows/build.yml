name: Build AutoCertRefresh

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  THEOS_DIR: /opt/theos
  # Use iOS 16.4 SDK - more reliably available than 16.5
  IOS_SDK_VERSION: 16.4
  TARGET_IOS: 14.0
  # Disable Swift stdlib linking - SDK may not have it, tweak uses ObjC++ only
  LINK_SWIFT: 0

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            COUNT=$(git rev-list --count HEAD)
            HASH=$(git rev-parse --short HEAD)
            echo "VERSION=0.0.0-dev.${COUNT}.${HASH}" >> $GITHUB_OUTPUT
          fi

      - name: Cache Theos & SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            /opt/theos
            ~/.theos-cache
          key: theos-ios-${{ env.IOS_SDK_VERSION }}-${{ matrix.arch }}-v3-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            theos-ios-${{ env.IOS_SDK_VERSION }}-${{ matrix.arch }}-v3-

      - name: Install Theos & SDK (if not cached)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        env:
          IOS_SDK_VERSION: ${{ env.IOS_SDK_VERSION }}
        run: |
          set -euo pipefail

          # Install Theos
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

          # Install iOS SDK from a reliable mirror
          # Try primary, then fallback
          SDK_URLS=(
            "https://github.com/theos/sdks/releases/download/iphoneos${IOS_SDK_VERSION}/iphoneos${IOS_SDK_VERSION}.sdk.tar.xz"
            "https://github.com/phoenixdev-org/sdks/releases/download/iphoneos${IOS_SDK_VERSION}/iphoneos${IOS_SDK_VERSION}.sdk.tar.xz"
            "https://cdn.discordapp.com/attachments/123456789/iphoneos${IOS_SDK_VERSION}.sdk.tar.xz"
          )

          SDK_DOWNLOADED=0
          for url in "${SDK_URLS[@]}"; do
            echo "Trying SDK: $url"
            if curl -L -f -o /tmp/iphoneos${IOS_SDK_VERSION}.sdk.tar.xz "$url" 2>/dev/null; then
              SDK_DOWNLOADED=1
              break
            fi
          done

          if [ $SDK_DOWNLOADED -eq 0 ]; then
            echo "::error::Failed to download iOS SDK from all mirrors"
            exit 1
          fi

          mkdir -p /opt/theos/sdks
          tar -xf /tmp/iphoneos${IOS_SDK_VERSION}.sdk.tar.xz -C /opt/theos/sdks

          # Find the actual SDK directory name (varies by archive)
          SDK_DIR=$(find /opt/theos/sdks -maxdepth 1 -type d -name "*.sdk" | head -1)
          if [ -z "$SDK_DIR" ]; then
            SDK_DIR=$(find /opt/theos/sdks -maxdepth 1 -type d -name "iphoneos*" | head -1)
          fi

          if [ -n "$SDK_DIR" ]; then
            ln -sf "$SDK_DIR" /opt/theos/sdks/iphoneos.sdk
            echo "SDK linked: $SDK_DIR -> /opt/theos/sdks/iphoneos.sdk"
          else
            echo "::error::SDK directory not found after extraction"
            ls -la /opt/theos/sdks/
            exit 1
          fi

          # Install ldid
          brew install ldid >/dev/null 2>&1 || true

          # Cache
          cp -r /opt/theos ~/.theos-cache/theos
          cp -r /opt/theos/sdks ~/.theos-cache/sdks

      - name: Restore Theos from cache
        if: steps.cache-theos.outputs.cache-hit == 'true'
        run: |
          cp -r ~/.theos-cache/theos /opt/theos
          cp -r ~/.theos-cache/sdks /opt/theos/sdks
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

      - name: Verify toolchain
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          echo "=== Toolchain ==="
          which make
          which clang
          which ldid
          which dpkg-deb
          $THEOS/bin/bootstrap.sh --version 2>&1 | head -5 || true
          echo "=== SDK ==="
          ls -la $THEOS/sdks/
          echo "=== SDK Contents ==="
          ls -la $THEOS/sdks/iphoneos.sdk/ 2>/dev/null | head -20 || true

      - name: Build package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          FINALPACKAGE: 1
          FOR_RELEASE: 1
          LINK_SWIFT: ${{ env.LINK_SWIFT }}
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

          echo "Building for ARCH=$ARCH VERSION=$VERSION"

          # Build with verbose output on failure
          if make package ARCH=${ARCH} VERSION=${VERSION} 2>&1; then
            echo "Build succeeded"
          else
            echo "::error::Build failed, showing last 100 lines of make output"
            exit 1
          fi

          # Find the built deb
          DEB_FILE=$(find .theos/_/debs -name "*.deb" 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::No .deb found!"
            ls -la .theos/_/debs/ 2>/dev/null || true
            exit 1
          fi

          echo "DEB_FILE=$DEB_FILE" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename $DEB_FILE)" >> $GITHUB_ENV

      - name: Verify .deb contents
        run: |
          dpkg-deb -c "${DEB_FILE}"
          dpkg-deb -I "${DEB_FILE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCertRefresh-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}
          path: ${{ env.DEB_FILE }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AutoCertRefresh-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;
          ls -la release/

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## AutoCertRefresh v${TAG}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT || echo "- Initial release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AutoCertRefresh v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: release/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true