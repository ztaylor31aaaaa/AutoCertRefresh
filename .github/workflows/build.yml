name: Build AutoCertRefresh

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IOS_SDK_VERSION: 16.2
  TARGET_IOS: 14.0

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev.$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Install Theos + iOS 16.2 SDK
        run: |
          set -euo pipefail
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

          # Install Theos (sudo for /opt/theos)
          sudo git clone --depth 1 https://github.com/theos/theos.git /opt/theos

          # iOS 16.2 SDK - confirmed available
          SDK_VER=16.2
          curl -L -f -o /tmp/iphoneos${SDK_VER}.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/iphoneos${SDK_VER}/iphoneos${SDK_VER}.sdk.tar.xz"

          sudo mkdir -p /opt/theos/sdks
          sudo tar -xf /tmp/iphoneos${SDK_VER}.sdk.tar.xz -C /opt/theos/sdks

          # Link SDK
          SDK_DIR=$(find /opt/theos/sdks -maxdepth 1 -type d -name "*.sdk" | head -1)
          sudo ln -sf "$SDK_DIR" /opt/theos/sdks/iphoneos.sdk

          # Install ldid
          brew install ldid >/dev/null 2>&1 || true

      - name: Build package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          FINALPACKAGE: 1
          FOR_RELEASE: 1
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package ARCH=${ARCH} VERSION=${VERSION}

      - name: Find .deb
        id: deb
        run: |
          f=$(find .theos/_/debs -name "*.deb" 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "::error::No .deb found"
            ls -la .theos/_/debs/ 2>/dev/null || true
            exit 1
          fi
          echo "file=$f" >> $GITHUB_OUTPUT
          echo "name=$(basename $f)" >> $GITHUB_OUTPUT

      - name: Verify .deb
        run: |
          dpkg-deb -c "${{ steps.deb.outputs.file }}"
          dpkg-deb -I "${{ steps.deb.outputs.file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCertRefresh-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}
          path: ${{ steps.deb.outputs.file }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AutoCertRefresh-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## AutoCertRefresh v${TAG}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT || echo "- Initial release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AutoCertRefresh v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: release/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true