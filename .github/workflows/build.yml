name: Build AutoCertRefresh

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGET_IOS: 14.0

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm64e]
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0-dev.$(git rev-list --count HEAD).$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Setup Theos + use Xcode system SDK
        run: |
          set -euo pipefail
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

          # Install Theos
          sudo git clone --depth 1 https://github.com/theos/theos.git /opt/theos

          # Install dm.pl directly (vendor/dpkg is a submodule not in raw.githubusercontent.com)
          sudo mkdir -p /opt/theos/bin
          sudo tee /opt/theos/bin/dm.pl > /dev/null << 'DMPL_EOF'
#!/usr/bin/perl
# dm.pl - Debian package maintenance script for Theos
# Simplified version for CI builds

use strict;
use warnings;
use File::Basename;
use File::Path qw(make_path);

my $version = "1.0";
my $progname = basename($0);

sub usage {
    print <<EOF;
Usage: $progname [options] command [args...]

Commands:
  prepare <control-file> <output-dir>    Prepare Debian package structure
  build <package-dir> <output-deb>       Build .deb package
  version                                Show version

Options:
  -h, --help     Show this help
  -v, --verbose  Verbose output
EOF
    exit(0);
}

sub verbose_print {
    print @_ if $ENV{DM_VERBOSE};
}

my $verbose = 0;
my @args;

while (@ARGV) {
    my $arg = shift @ARGV;
    if ($arg eq '-h' || $arg eq '--help') { usage(); }
    elsif ($arg eq '-v' || $arg eq '--verbose') { $verbose = 1; $ENV{DM_VERBOSE} = 1; }
    elsif ($arg eq '--version') { print "$progname $version\n"; exit(0); }
    else { push @args, $arg; }
}

@ARGV = @args;
my $cmd = shift @ARGV || usage();

if ($cmd eq 'prepare') {
    my ($control_file, $output_dir) = @ARGV;
    die "Usage: $progname prepare <control-file> <output-dir>\n" unless $control_file && $output_dir;

    make_path("$output_dir/DEBIAN");
    system("cp", "$control_file", "$output_dir/DEBIAN/control") == 0 or die "Failed to copy control file: $!";
    verbose_print("Prepared $output_dir/DEBIAN/control\n");
}
elsif ($cmd eq 'build') {
    my ($package_dir, $output_deb) = @ARGV;
    die "Usage: $progname build <package-dir> <output-deb>\n" unless $package_dir && $output_deb;

    # Ensure DEBIAN/control exists
    die "No DEBIAN/control in $package_dir\n" unless -f "$package_dir/DEBIAN/control";

    # Build with dpkg-deb
    system("dpkg-deb", "--build", "--root-owner-group", "$package_dir", "$output_deb") == 0
        or die "dpkg-deb failed: $!";
    verbose_print("Built $output_deb\n");
}
elsif ($cmd eq 'version') {
    print "$progname $version\n";
}
else {
    die "Unknown command: $cmd\n";
}
DMPL_EOF
          sudo chmod +x /opt/theos/bin/dm.pl
          echo "Installed dm.pl to /opt/theos/bin/dm.pl"

          # Use Xcode's built-in iOS SDK (no download needed)
          # macOS runners have Xcode with iPhoneOS.sdk
          XCODE_SDK="/Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          if [ -d "$XCODE_SDK" ]; then
            sudo mkdir -p /opt/theos/sdks
            sudo ln -sf "$XCODE_SDK" /opt/theos/sdks/iphoneos.sdk
            echo "Linked Xcode SDK: $XCODE_SDK -> /opt/theos/sdks/iphoneos.sdk"
          else
            echo "::error::Xcode iOS SDK not found at $XCODE_SDK"
            ls -la /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/
            exit 1
          fi

          # Install ldid
          brew install ldid >/dev/null 2>&1 || true

      - name: Build package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          FINALPACKAGE: 1
          FOR_RELEASE: 1
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:$PATH

          # Verify dm.pl is linked and executable
          ls -la /opt/theos/bin/dm.pl
          /opt/theos/bin/dm.pl --version 2>&1 || true

          make package ARCH=${ARCH} VERSION=${VERSION}

      - name: Find .deb
        id: deb
        run: |
          f=$(find .theos/_/debs -name "*.deb" 2>/dev/null | head -1)
          if [ -z "$f" ]; then
            echo "::error::No .deb found"
            ls -la .theos/_/debs/ 2>/dev/null || true
            exit 1
          fi
          echo "file=$f" >> $GITHUB_OUTPUT
          echo "name=$(basename $f)" >> $GITHUB_OUTPUT

      - name: Verify .deb
        run: |
          dpkg-deb -c "${{ steps.deb.outputs.file }}"
          dpkg-deb -I "${{ steps.deb.outputs.file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCertRefresh-${{ matrix.arch }}-${{ steps.version.outputs.VERSION }}
          path: ${{ steps.deb.outputs.file }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AutoCertRefresh-*
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "## AutoCertRefresh v${TAG}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_OUTPUT || echo "- Initial release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AutoCertRefresh v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: release/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true